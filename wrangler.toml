name = "kasaglowclean-aistudio"
pages_build_output_dir = "dist"

compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "kasaglow-submissions"
database_id = "4b729739-978c-41ac-af74-7ad8df3b943d"

[vars]
SITE_URL = "https://kasaglowclean.com"
# Flip to "live" once real PayPal credentials are set as secrets.
PAYPAL_ENV = "sandbox"
# Booking deposit in cents ($35 default).
DEPOSIT_CENTS = "3500"

# SECRETS — never commit these. Set in the Cloudflare dashboard
# (Pages project → Settings → Environment variables, type "Secret")
# or via: wrangler pages secret put <NAME> --project-name kasaglowclean-aistudio
#   ADMIN_SECRET       (long random string; the old committed one is burned)
#   RESEND_API_KEY     (ROTATE — the previous key was committed publicly)
#   STRIPE_SECRET_KEY  (sk_live_...)
#   PAYPAL_CLIENT_ID / PAYPAL_SECRET  (live app credentials)
# Build-time var for the frontend PayPal button:
#   VITE_PAYPAL_CLIENT_ID  (plain env var, not secret)
